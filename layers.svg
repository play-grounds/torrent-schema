try</text><text x="260" y="688" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#1f2328">CompactPeer</text><text x="76" y="708" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#1f2328">CompactPeer6</text><text x="260" y="708" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#1f2328">UdpConnectRequest</text><text x="76" y="728" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#1f2328">UdpConnectResponse</text><text x="260" y="728" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#1f2328">UdpAnnounceRequest</text><text x="76" y="748" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#1f2328">UdpAnnounceResponse</text><text x="260" y="748" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#1f2328">UdpScrapeRequest</text><text x="76" y="768" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#1f2328">UdpScrapeResponse</text><text x="260" y="768" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#1f2328">UdpScrapeCounts</text><text x="76" y="788" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#1f2328">UdpError</text><text x="260" y="788" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#1f2328">Tracker</text><text x="76" y="808" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#1f2328">KnownTorrent</text></g></a><a href="webtorrent"><g><rect x="940" y="536" width="400" height="198" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="956" y="564" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#1f2328">find peers from a browser</text><text x="956" y="584" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#0969da">module webtorrent · layer overlay</text><text x="956" y="604" font-fa